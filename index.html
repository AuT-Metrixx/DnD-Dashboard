<script>
    const firebaseConfig = {
        databaseURL: "https://dnd-live-dashboard-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    
    let db = null;
    let isCloudActive = false;
    let currentActiveCharId = null;
    let activeRoom = "zarthul-gruppe";
    let currentUser = null;
    let currentRole = null;
    let mySessionId = 'session_' + Math.random().toString(36).substring(2, 9);

    const validAccounts = ["admin", "test1", "test2", "test3", "test4"];

    const subclassData = {
        "Barbar": ["Pfad des Weltenbaums", "Pfad des Berserkers", "Pfad des Totemkriegers"],
        "Barde": ["Kollegium der Lore", "Kollegium der Tapferkeit"],
        "Kleriker": ["Domäne des Lebens", "Domäne des Lichts", "Domäne des Sturms"],
        "Druide": ["Zirkel des Mondes", "Zirkel der Sterne", "Zirkel des Landes", "Zirkel des Sporen"],
        "Kämpfer": ["Meister des Kampfs (Battle Master)", "Champion", "Mystischer Ritter"],
        "Mönch": ["Weg der Offenen Hand", "Weg des Schattens"],
        "Paladin": ["Eid der Hingabe", "Eid der Rache"],
        "Waldläufer": ["Jäger", "Tierherr (Beast Master)"],
        "Schurke": ["Dieb", "Assassine", "Arcane Trickster"],
        "Hexenmeister": ["Der Große Alte", "Die Feenwesen-Patronin", "Der Unterweltler"],
        "Zauberer": ["Drachenblut-Linie", "Wilde Magie"],
        "Magier": ["Schule der Evokation", "Schule der Abjuration"]
    };

    function processLogin() {
        let u = document.getElementById('login-user').value.trim().toLowerCase();
        let p = document.getElementById('login-pass').value.trim();
        let err = document.getElementById('login-error');

        if (validAccounts.includes(u) && p === "0000") {
            currentUser = u;
            localStorage.setItem('dnd_logged_user', u);
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('role-overlay').classList.remove('hidden');
        } else {
            err.innerText = "Ungültiger Benutzername oder Passwort!";
        }
    }

    function registerSingleSession() {
        if (!isCloudActive || !db || !currentUser) return;
        let sessionRef = db.ref('active_sessions/' + currentUser);
        sessionRef.set({
            sessionId: mySessionId,
            loginTime: Date.now()
        });

        sessionRef.on('value', (snapshot) => {
            let data = snapshot.val();
            if (data && data.sessionId && data.sessionId !== mySessionId) {
                alert("⚠️ Du wurdest abgemeldet! Dieser Account (" + currentUser.toUpperCase() + ") wurde auf einem anderen Gerät angemeldet.");
                logout();
            }
        });
    }

    function selectRole(role) {
        currentRole = role;
        localStorage.setItem('dnd_logged_role', role);
        document.getElementById('role-overlay').classList.add('hidden');
        setupNavigation();
        let userDisp = document.getElementById('user-display-name');
        if (userDisp) userDisp.innerText = currentUser.toUpperCase() + (role === 'dm' ? ' (DM)' : '');
        initApp();
        registerSingleSession();
    }

    function setupNavigation() {
        let nav = document.getElementById('main-nav');
        if (!nav) return;
        if (currentRole === 'dm') {
            nav.style.gridTemplateColumns = 'repeat(2, 1fr)';
            nav.innerHTML = `
                <button type="button" class="mode-btn active" id="btn-mode-dm" onclick="switchMode('dm')">DM Ansicht</button>
                <button type="button" class="mode-btn btn-logout-nav" onclick="logout()">Abmelden 🚪</button>
            `;
        } else {
            nav.style.gridTemplateColumns = 'repeat(4, 1fr)';
            nav.innerHTML = `
                <button type="button" class="mode-btn active" id="btn-mode-lobby" onclick="switchMode('lobby')">Lobby</button>
                <button type="button" class="mode-btn" id="btn-mode-sheet" onclick="switchMode('sheet')">Charakter</button>
                <button type="button" class="mode-btn" id="btn-mode-party" onclick="switchMode('party')">Party Live</button>
                <button type="button" class="mode-btn btn-logout-nav" onclick="logout()">Abmelden 🚪</button>
            `;
        }
        nav.style.display = 'grid';
    }

    function logout() {
        localStorage.removeItem('dnd_logged_user');
        localStorage.removeItem('dnd_logged_role');
        location.reload();
    }

    function joinRoom() {
        let codeInput = document.getElementById('join-room-input');
        if (!codeInput) return;
        let code = codeInput.value.trim().toLowerCase();
        if (!code) { alert("Bitte gib einen gültigen Raum-Code ein!"); return; }
        activeRoom = code;
        localStorage.setItem('dnd_active_room_' + currentUser, code);
        initCloudSync();
        saveData();
        renderCharacterList();
        alert("Erfolgreich dem Raum '" + code + "' beigetreten!");
    }

    // Neu: DM muss den Raum explizit bestätigen mit Button-Klick
    function confirmDMRoom() {
        let dmInput = document.getElementById('dm-room-code-input');
        if (!dmInput) return;
        let newCode = dmInput.value.trim().toLowerCase();
        if (!newCode) { alert("Bitte einen gültigen Raum-Namen eingeben!"); return; }
        
        activeRoom = newCode;
        localStorage.setItem('dnd_active_room_' + currentUser, activeRoom);
        let joinInput = document.getElementById('join-room-input');
        if (joinInput) joinInput.value = activeRoom;
        
        initCloudSync();
        alert("👑 DM-Raum aktiv gewechselt zu: " + activeRoom);
    }

    // Neu: DM kann einen Charakter / Spieler aus dem Raum kicken
    function dmKickCharacter(charKey) {
        if (!confirm("Möchtest du diesen Charakter wirklich aus dem Raum werfen?")) return;
        if (!isCloudActive || !db) return;
        
        db.ref('rooms/' + activeRoom + '/characters/' + charKey).remove().then(() => {
            alert("Charakter erfolgreich aus dem Raum entfernt.");
        });
    }

    function manualSaveWithFeedback() {
        saveData();
        let btn = document.querySelector('.btn-save-compact');
        if (btn) {
            let originalText = btn.innerText;
            btn.innerText = "✅ Gespeichert!";
            setTimeout(() => { btn.innerText = originalText; }, 1500);
        }
    }

    function toggleCondition(condName) {
        let btn = document.getElementById('cond-' + condName);
        if (btn) btn.classList.toggle('active');
        saveData();
    }

    function saveDMSecetNote(charKey, noteText) {
        if (!isCloudActive || !db) return;
        db.ref('rooms/' + activeRoom + '/characters/' + charKey + '/dmNote').set(noteText);
    }

    function updateRageButtonText() {
        let curr = parseInt(document.getElementById('rage-curr').value) || 0;
        let max = parseInt(document.getElementById('rage-max').value) || 4;
        let btnToggle = document.getElementById('btn-toggle-rage');
        if (!btnToggle) return;
        let isActive = btnToggle.classList.contains('active');
        btnToggle.innerText = isActive ? `🔥 Wut beenden (${curr}/${max} übrig)` : `🔥 Wut (${curr}/${max})`;
    }

    function toggleRageState() {
        let btnToggle = document.getElementById('btn-toggle-rage');
        let currInput = document.getElementById('rage-curr');
        if (!btnToggle || !currInput) return;
        let max = parseInt(document.getElementById('rage-max').value) || 4;
        let curr = parseInt(currInput.value) || 0;
        let isActive = btnToggle.classList.contains('active');

        if (!isActive) {
            if (curr <= 0) { alert("Du hast keine Wut-Einsätze mehr übrig!"); return; }
            currInput.value = curr - 1;
            btnToggle.classList.add('active');
        } else {
            btnToggle.classList.remove('active');
        }
        updateRageButtonText();
        saveData();
    }

    function useWorldTreeVigor() {
        let lvl = parseInt(document.getElementById('char-level').value) || 1;
        let conMod = getMod(parseInt(document.getElementById('con').value));
        let tempHpVal = conMod + lvl;
        let targetEl = document.getElementById('worldtree-target');
        let target = targetEl ? targetEl.value.trim() : 'Ich';

        let tempHpInput = document.getElementById('hp-temp');
        let currentTemp = tempHpInput ? (parseInt(tempHpInput.value) || 0) : 0;
        if (tempHpInput) tempHpInput.value = Math.max(currentTemp, tempHpVal);
        saveData();
        alert(`🌳 Vitalität des Weltenbaums aktiv! ${target} erhält ${tempHpVal} temporäre Trefferpunkte.`);
    }

    function updateKiDisplay() {
        let curr = parseInt(document.getElementById('ki-curr').value) || 0;
        let max = parseInt(document.getElementById('ki-max').value) || 6;
        let disp = document.getElementById('ki-display');
        if (disp) disp.innerText = `${curr}/${max}`;
    }

    function useKiPoint() {
        let currInput = document.getElementById('ki-curr');
        if (!currInput) return;
        let curr = parseInt(currInput.value) || 0;
        if (curr <= 0) { alert("Keine Ki-Punkte mehr übrig!"); return; }
        currInput.value = curr - 1;
        updateKiDisplay();
        saveData();
    }

    function useKiAction(actionName) {
        let currInput = document.getElementById('ki-curr');
        if (!currInput) return;
        let curr = parseInt(currInput.value) || 0;
        if (curr <= 0) { alert(`Keine Ki-Punkte mehr für ${actionName} übrig!`); return; }
        currInput.value = curr - 1;
        updateKiDisplay();
        saveData();
        alert(`⚡ Ki-Punkt eingesetzt für ${actionName}!`);
    }

    function updateActionSurgeDisplay() {
        let curr = parseInt(document.getElementById('surge-curr').value) || 0;
        let max = parseInt(document.getElementById('surge-max').value) || 1;
        let disp = document.getElementById('surge-display');
        if (disp) disp.innerText = `${curr}/${max}`;
    }

    function useActionSurge() {
        let currInput = document.getElementById('surge-curr');
        if (!currInput) return;
        let curr = parseInt(currInput.value) || 0;
        if (curr <= 0) { alert("Aktionsschub bereits verbraucht!"); return; }
        currInput.value = curr - 1;
        updateActionSurgeDisplay();
        saveData();
    }

    function updateSecondWindDisplay() {
        let curr = parseInt(document.getElementById('wind-curr').value) || 0;
        let max = parseInt(document.getElementById('wind-max').value) || 1;
        let disp = document.getElementById('wind-display');
        if (disp) disp.innerText = `${curr}/${max}`;
    }

    function useSecondWind() {
        let currInput = document.getElementById('wind-curr');
        if (!currInput) return;
        let curr = parseInt(currInput.value) || 0;
        if (curr <= 0) { alert("Durchschnaufen bereits verbraucht!"); return; }
        currInput.value = curr - 1;
        updateSecondWindDisplay();
        saveData();
    }

    function updateWildformDisplay() {
        let curr = parseInt(document.getElementById('wildform-curr').value) || 0;
        let max = parseInt(document.getElementById('wildform-max').value) || 2;
        let disp = document.getElementById('wildform-display');
        if (disp) disp.innerText = `${curr}/${max}`;
    }

    function useWildform() {
        let currInput = document.getElementById('wildform-curr');
        if (!currInput) return;
        let curr = parseInt(currInput.value) || 0;
        if (curr <= 0) { alert("Keine Wildform-Einsätze mehr übrig!"); return; }
        currInput.value = curr - 1;
        updateWildformDisplay();
        saveData();
    }

    function triggerLongRest() {
        if (confirm("Lange Rast durchführen? (Regeneriert HP, Zauberplätze & alle Klassenressourcen)")) {
            let maxHpEl = document.getElementById('hp-max');
            let maxHp = maxHpEl ? maxHpEl.value : '0';
            let hpCurr = document.getElementById('hp-curr');
            let hpTemp = document.getElementById('hp-temp');
            if (hpCurr) hpCurr.value = maxHp;
            if (hpTemp) hpTemp.value = 0;

            for (let i = 1; i <= 6; i++) {
                let slotC = document.getElementById(`slot-${i}-c`);
                if (slotC) slotC.value = 0;
            }

            let rageCurr = document.getElementById('rage-curr');
            let rageMax = document.getElementById('rage-max');
            if (rageCurr && rageMax) rageCurr.value = rageMax.value;
            let btnToggle = document.getElementById('btn-toggle-rage');
            if (btnToggle) btnToggle.classList.remove('active');
            updateRageButtonText();

            let kiCurr = document.getElementById('ki-curr');
            let kiMax = document.getElementById('ki-max');
            if (kiCurr && kiMax) kiCurr.value = kiMax.value;
            updateKiDisplay();

            let surgeCurr = document.getElementById('surge-curr');
            let surgeMax = document.getElementById('surge-max');
            if (surgeCurr && surgeMax) surgeCurr.value = surgeMax.value;
            updateActionSurgeDisplay();

            let windCurr = document.getElementById('wind-curr');
            let windMax = document.getElementById('wind-max');
            if (windCurr && windMax) windCurr.value = windMax.value;
            updateSecondWindDisplay();

            let wildCurr = document.getElementById('wildform-curr');
            let wildMax = document.getElementById('wildform-max');
            if (wildCurr && wildMax) wildCurr.value = wildMax.value;
            updateWildformDisplay();

            saveData();
            alert("🏕️ Lange Rast abgeschlossen! Alle Ressourcen wieder voll.");
        }
    }

    function triggerShortRest() {
        let cls = document.getElementById('char-class');
        if (!cls) return;
        if (cls.value === "Hexenmeister") { let s1 = document.getElementById('slot-1-c'); if (s1) s1.value = 0; }
        if (cls.value === "Kämpfer") {
            let sCurr = document.getElementById('surge-curr');
            let sMax = document.getElementById('surge-max');
            if (sCurr && sMax) sCurr.value = sMax.value;
            updateActionSurgeDisplay();
            let wCurr = document.getElementById('wind-curr');
            let wMax = document.getElementById('wind-max');
            if (wCurr && wMax) wCurr.value = wMax.value;
            updateSecondWindDisplay();
        }
        saveData();
        alert("☕ Kurze Rast abgeschlossen!");
    }

    function updateSubclasses() {
        let clsEl = document.getElementById('char-class');
        let subSelect = document.getElementById('char-subclass');
        if (!clsEl || !subSelect) return;
        subSelect.innerHTML = '';
        
        let list = subclassData[clsEl.value] || ["Allgemein"];
        list.forEach(sub => {
            let opt = document.createElement('option');
            opt.value = sub;
            opt.innerText = sub;
            subSelect.appendChild(opt);
        });
        onSubclassChange();
    }

    function setStarForm(formName) {
        let formInput = document.getElementById('active-star-form');
        if (!formInput) return;
        let current = formInput.value;
        let next = (current === formName) ? '' : formName;
        formInput.value = next;

        let f1 = document.getElementById('star-form-1');
        let f2 = document.getElementById('star-form-2');
        let f3 = document.getElementById('star-form-3');
        if (f1) f1.classList.toggle('active', next === 'Meckler');
        if (f2) f2.classList.toggle('active', next === 'Kelch');
        if (f3) f3.classList.toggle('active', next === 'Drache');
        saveData();
    }

    function onSubclassChange() {
        let clsEl = document.getElementById('char-class');
        let subSelect = document.getElementById('char-subclass');
        if (!clsEl || !subSelect) return;
        let cls = clsEl.value;
        let sub = subSelect.value;

        let subresMoon = document.getElementById('subres-moon');
        let subresStars = document.getElementById('subres-stars');
        let subresBM = document.getElementById('subres-battlemaster');
        let subresWorldTree = document.getElementById('subres-worldtree');

        if (subresMoon) subresMoon.classList.add('hidden');
        if (subresStars) subresStars.classList.add('hidden');
        if (subresBM) subresBM.classList.add('hidden');
        if (subresWorldTree) subresWorldTree.classList.add('hidden');

        if (cls === "Druide") {
            if (sub === "Zirkel des Mondes") subresMoon.classList.remove('hidden');
            if (sub === "Zirkel der Sterne") subresStars.classList.remove('hidden');
        } else if (cls === "Kämpfer" && sub.includes("Battle Master")) {
            if (subresBM) subresBM.classList.remove('hidden');
        } else if (cls === "Barbar" && sub.includes("Weltenbaum")) {
            if (subresWorldTree) subresWorldTree.classList.remove('hidden');
        }
    }

    function autoScaleResources() {
        let clsEl = document.getElementById('char-class');
        let lvlEl = document.getElementById('char-level');
        if (!clsEl || !lvlEl) return;
        let cls = clsEl.value;
        let lvl = parseInt(lvlEl.value) || 1;

        if (cls === "Barbar") {
            let maxRage = lvl >= 17 ? 6 : (lvl >= 12 ? 5 : (lvl >= 6 ? 4 : (lvl >= 3 ? 3 : 2)));
            let rMax = document.getElementById('rage-max');
            if (rMax) rMax.value = maxRage;
            let rCurr = document.getElementById('rage-curr');
            if (rCurr && (isNaN(parseInt(rCurr.value)) || parseInt(rCurr.value) > maxRage)) rCurr.value = maxRage;
            updateRageButtonText();
        } else if (cls === "Mönch") {
            let kiMax = lvl;
            let kMax = document.getElementById('ki-max');
            if (kMax) kMax.value = kiMax;
            let kCurr = document.getElementById('ki-curr');
            if (kCurr && (isNaN(parseInt(kCurr.value)) || parseInt(kCurr.value) > kiMax)) kCurr.value = kiMax;
            updateKiDisplay();
        } else if (cls === "Kämpfer") {
            let maxSurge = lvl >= 17 ? 2 : (lvl >= 2 ? 1 : 0);
            let maxWind = lvl >= 10 ? 3 : (lvl >= 4 ? 2 : 1);
            let sMax = document.getElementById('surge-max');
            let wMax = document.getElementById('wind-max');
            if (sMax) sMax.value = maxSurge;
            if (wMax) wMax.value = maxWind;
            updateActionSurgeDisplay();
            updateSecondWindDisplay();
        } else if (cls === "Druide") {
            let wMax = document.getElementById('wildform-max');
            if (wMax) wMax.value = 2;
            updateWildformDisplay();
        } else if (cls === "Schurke") {
            let sneakDice = Math.ceil(lvl / 2) + "W6";
            let sElem = document.getElementById('sneak-atk-dice');
            if (sElem) sElem.innerText = sneakDice;
        }
    }

    function onClassChange() {
        let clsEl = document.getElementById('char-class');
        if (!clsEl) return;
        let cls = clsEl.value;
        let spellSection = document.getElementById('spell-section');
        
        let resBarbar = document.getElementById('res-barbar');
        let resMoench = document.getElementById('res-moench');
        let resKaempfer = document.getElementById('res-kaempfer');
        let resSchurke = document.getElementById('res-schurke');
        let resDruide = document.getElementById('res-druide');

        if (resBarbar) resBarbar.classList.add('hidden');
        if (resMoench) resMoench.classList.add('hidden');
        if (resKaempfer) resKaempfer.classList.add('hidden');
        if (resSchurke) resSchurke.classList.add('hidden');
        if (resDruide) resDruide.classList.add('hidden');

        if (cls === "Barbar" && resBarbar) resBarbar.classList.remove('hidden');
        if (cls === "Mönch" && resMoench) resMoench.classList.remove('hidden');
        if (cls === "Kämpfer" && resKaempfer) resKaempfer.classList.remove('hidden');
        if (cls === "Schurke" && resSchurke) resSchurke.classList.remove('hidden');
        if (cls === "Druide" && resDruide) resDruide.classList.remove('hidden');

        const spellClasses = ["Barde", "Kleriker", "Druide", "Paladin", "Waldläufer", "Hexenmeister", "Zauberer", "Magier"];
        if (spellSection) {
            if (spellClasses.includes(cls)) spellSection.classList.remove('hidden');
            else spellSection.classList.add('hidden');
        }

        autoScaleResources();
        onSubclassChange();
        updateAllCalculations();
    }

    function initCloudSync() {
        let statusElem = document.getElementById('sync-status');
        let debugBox = document.getElementById('dm-debug-box');

        if (!firebase.apps.length) {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isCloudActive = true;
            } catch (e) { isCloudActive = false; }
        }

        if (isCloudActive && db) {
            if (statusElem) {
                statusElem.innerText = "Verbunden mit Raum: " + activeRoom + " (⚡)";
                statusElem.style.color = "var(--pos-color)";
            }
            if (debugBox) debugBox.innerHTML = `🔍 Verbunden mit Raum: <b>${activeRoom}</b>. Lausche auf Firebase...`;
            
            db.ref('rooms/' + activeRoom).on('value', (snapshot) => {
                let data = snapshot.val();
                renderPartyViews(data);
                if (currentRole === 'player') renderCharacterList();
            }, (error) => {
                if (debugBox) debugBox.innerHTML = `❌ Firebase Fehler: ${error.message}`;
            });

            if (currentUser) registerSingleSession();
        } else {
            if (statusElem) {
                statusElem.innerText = "Lokal Modus";
                statusElem.style.color = "var(--text-muted)";
            }
            if (debugBox) debugBox.innerHTML = `❌ Cloud inaktiv (Lokal Modus).`;
        }
    }

    function pushCharacterToCloud() {
        if (!isCloudActive || !db || !currentActiveCharId || currentRole === 'dm') return;

        let activeConcentration = '';
        document.querySelectorAll('.spell-row').forEach(row => {
            let concBox = row.querySelector('.spell-conc');
            if (concBox && concBox.checked) {
                let nameBox = row.querySelector('.spell-name');
                if (nameBox) activeConcentration = nameBox.value;
            }
        });

        let btnToggle = document.getElementById('btn-toggle-rage');
        let charClassEl = document.getElementById('char-class');
        let isRaging = (charClassEl && charClassEl.value === "Barbar" && btnToggle && btnToggle.classList.contains('active'));

        let conditions = {
            poisoned: document.getElementById('cond-poisoned').classList.contains('active'),
            stunned: document.getElementById('cond-stunned').classList.contains('active'),
            prone: document.getElementById('cond-prone').classList.contains('active'),
            paralyzed: document.getElementById('cond-paralyzed').classList.contains('active')
        };

        let charData = {
            user: currentUser,
            id: currentActiveCharId,
            name: document.getElementById('char-name').value || 'Helden-Charakter',
            clazz: charClassEl ? charClassEl.value : 'Unbekannt',
            subclass: document.getElementById('char-subclass').value || '',
            concentration: activeConcentration,
            starForm: document.getElementById('active-star-form') ? document.getElementById('active-star-form').value : '',
            moonBeast: document.getElementById('moon-beast-name') ? document.getElementById('moon-beast-name').value : '',
            moonBeastHp: document.getElementById('moon-beast-hp') ? document.getElementById('moon-beast-hp').value : '',
            moonBeastAc: document.getElementById('moon-beast-ac') ? document.getElementById('moon-beast-ac').value : '',
            isRaging: isRaging,
            conditions: conditions,
            level: document.getElementById('char-level').value || '1',
            hpCurr: document.getElementById('hp-curr').value || '0',
            hpMax: document.getElementById('hp-max').value || '0',
            hpTemp: document.getElementById('hp-temp').value || '0',
            ac: document.getElementById('ac').value || '10',
            lastUpdate: Date.now()
        };

        db.ref('rooms/' + activeRoom + '/characters/' + currentUser + '_' + currentActiveCharId).update(charData);
    }

    function removeCharacterFromCloud(charId) {
        if (!isCloudActive || !db) return;
        db.ref('rooms/' + activeRoom + '/characters/' + currentUser + '_' + charId).remove();
    }

    function onSliderToggle(charId, checkbox) {
        let activeInRoomCharId = localStorage.getItem('dnd_room_active_char_' + currentUser + '_' + activeRoom);

        if (!checkbox.checked) {
            if (activeInRoomCharId === charId) localStorage.removeItem('dnd_room_active_char_' + currentUser + '_' + activeRoom);
            removeCharacterFromCloud(charId);
        } else {
            if (activeInRoomCharId && activeInRoomCharId !== charId) removeCharacterFromCloud(activeInRoomCharId);
            localStorage.setItem('dnd_room_active_char_' + currentUser + '_' + activeRoom, charId);
            loadCharacterData(charId);
            pushCharacterToCloud();
        }
        renderCharacterList();
    }

    function renderPartyViews(data) {
        let partyContainer = document.getElementById('party-list-container');
        let dmContainer = document.getElementById('dm-list-container');

        if (!data || !data.characters || Object.keys(data.characters).length === 0) {
            if (partyContainer) partyContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 15px;">Keine Charaktere im Raum.</div>';
            if (dmContainer) dmContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 15px;">Keine Helden aktiv.</div>';
            return;
        }

        let partyHTML = '';
        let dmHTML = '';

        Object.entries(data.characters).forEach(([charKey, c]) => {
            if (!c || typeof c !== 'object') return;

            let name = c.name || 'Unbenannter Held';
            let clazz = c.clazz || 'Abenteurer';
            let level = c.level || '1';
            let subclass = c.subclass || '';
            let hpCurr = c.hpCurr !== undefined ? parseInt(c.hpCurr) : 0;
            let hpMax = c.hpMax !== undefined ? parseInt(c.hpMax) : 1;
            let ac = c.ac !== undefined ? c.ac : '10';

            let hpPercent = Math.max(0, Math.min(100, (hpCurr / Math.max(1, hpMax)) * 100));
            let hpColor = 'var(--pos-color)';
            if (hpPercent <= 15) {
                hpColor = 'var(--neg-color)';
            } else if (hpPercent < 50) {
                hpColor = 'var(--warning-color)';
            }

            let userTag = c.user ? ` <span style="font-size:0.75rem; color: var(--accent);">[${c.user.toUpperCase()}]</span>` : '';

            let badgesHTML = '';
            if (c.isRaging) badgesHTML += `<span class="dm-badge badge-rage">🔥 Wut aktiv</span>`;
            if (c.concentration) badgesHTML += `<span class="dm-badge badge-conc">🔮 Konz: ${c.concentration}</span>`;
            if (c.moonBeast) {
                let beastHp = c.moonBeastHp ? ` (HP: ${c.moonBeastHp})` : '';
                let beastAc = c.moonBeastAc ? ` [RK: ${c.moonBeastAc}]` : '';
                badgesHTML += `<span class="dm-badge badge-transform">🐾 Wildform: ${c.moonBeast}${beastHp}${beastAc}</span>`;
            }
            if (c.starForm) badgesHTML += `<span class="dm-badge badge-star">⭐ Sternenform: ${c.starForm}</span>`;

            if (c.conditions) {
                if (c.conditions.poisoned) badgesHTML += `<span class="dm-badge badge-cond">☣️ Vergiftet</span>`;
                if (c.conditions.stunned) badgesHTML += `<span class="dm-badge badge-cond">💫 Betäubt</span>`;
                if (c.conditions.prone) badgesHTML += `<span class="dm-badge badge-cond">🛌 Liegend</span>`;
                if (c.conditions.paralyzed) badgesHTML += `<span class="dm-badge badge-cond">⚡ Gelähmt</span>`;
            }

            partyHTML += `
                <div class="party-card">
                    <div class="party-card-top">
                        <div class="party-info">
                            <h3>${name}${userTag}</h3>
                            <p>${clazz} (${level}) • ${subclass}</p>
                        </div>
                        <div class="party-stats">
                            <div class="party-stat-box"><label>HP</label><span style="color: ${hpColor};">${hpCurr}/${hpMax}</span></div>
                            <div class="party-stat-box"><label>AC</label><span style="color:var(--text-color);">${ac}</span></div>
                        </div>
                    </div>
                </div>
            `;

            let dmNoteVal = c.dmNote || '';
            dmHTML += `
                <div class="party-card" style="border-left: 3px solid ${hpColor};">
                    <div class="party-card-top">
                        <div class="party-info">
                            <h3>${name}${userTag} <span style="font-size: 0.75rem; color: var(--text-muted);">(${clazz} ${level})</span></h3>
                            <p>Sub: ${subclass || '-'}</p>
                        </div>
                        <div class="party-stats">
                            <div class="party-stat-box"><label>HP</label><span style="color: ${hpColor};">${hpCurr}/${hpMax}</span></div>
                            <div class="party-stat-box"><label>RK</label><span style="color:var(--text-color);">${ac}</span></div>
                            <button type="button" class="btn-remove" onclick="dmKickCharacter('${charKey}')" title="Aus Raum kicken" style="margin-left: 8px; height: 32px; width: 32px;">✕</button>
                        </div>
                    </div>
                    ${badgesHTML ? `<div class="dm-status-badges">${badgesHTML}</div>` : ''}
                    <div class="dm-note-box">
                        <label style="text-align: left; font-size: 0.65rem; color: var(--warning-color);">👑 Geheime DM-Notiz:</label>
                        <input type="text" placeholder="Nur für den Spielleiter..." value="${dmNoteVal}" onchange="saveDMSecetNote('${charKey}', this.value)" style="font-size: 0.8rem; padding: 4px; text-align: left;">
                    </div>
                </div>
            `;
        });

        if (partyContainer) partyContainer.innerHTML = partyHTML || '<div style="text-align: center; color: var(--text-muted); padding: 15px;">Keine Charaktere im Raum.</div>';
        if (dmContainer) dmContainer.innerHTML = dmHTML || '<div style="text-align: center; color: var(--text-muted); padding: 15px;">Keine Helden aktiv.</div>';
    }

    function switchMode(mode) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        let lobby = document.getElementById('view-lobby');
        let sheet = document.getElementById('view-sheet');
        let party = document.getElementById('view-party');
        let dm = document.getElementById('view-dm');

        if (lobby) lobby.classList.add('hidden');
        if (sheet) sheet.classList.add('hidden');
        if (party) party.classList.add('hidden');
        if (dm) dm.classList.add('hidden');

        if (mode === 'lobby' && currentRole === 'player') {
            let btnLobby = document.getElementById('btn-mode-lobby');
            if (btnLobby) btnLobby.classList.add('active');
            if (lobby) lobby.classList.remove('hidden');
            renderCharacterList();
        } else if (mode === 'sheet' && currentRole === 'player') {
            if (!currentActiveCharId) {
                alert("Bitte wähle zuerst einen Charakter aus der Lobby aus!");
                switchMode('lobby');
                return;
            }
            let btnSheet = document.getElementById('btn-mode-sheet');
            if (btnSheet) btnSheet.classList.add('active');
            if (sheet) sheet.classList.remove('hidden');
        } else if (mode === 'party' && currentRole === 'player') {
            let btnParty = document.getElementById('btn-mode-party');
            if (btnParty) btnParty.classList.add('active');
            if (party) party.classList.remove('hidden');
        } else if (mode === 'dm' && currentRole === 'dm') {
            let btnDm = document.getElementById('btn-mode-dm');
            if (btnDm) btnDm.classList.add('active');
            if (dm) dm.classList.remove('hidden');
        }
    }

    function getCharactersList() {
        let list = localStorage.getItem('dnd_characters_index_' + currentUser);
        return list ? JSON.parse(list) : [];
    }

    function saveCharactersList(list) {
        localStorage.setItem('dnd_characters_index_' + currentUser, JSON.stringify(list));
    }

    function renderCharacterList() {
        let chars = getCharactersList();
        let container = document.getElementById('character-list-container');
        let activeInRoomCharId = localStorage.getItem('dnd_room_active_char_' + currentUser + '_' + activeRoom);

        if (!container) return;

        if (chars.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 10px;">Keine Charaktere für ' + currentUser.toUpperCase() + ' vorhanden. Erstelle deinen ersten Helden!</div>';
            return;
        }

        let html = '';
        chars.forEach(c => {
            let isActiveInRoom = (c.id === activeInRoomCharId);
            html += `
                <div class="char-select-card">
                    <div class="char-select-info" onclick="loadCharacter('${c.id}')" style="flex-grow: 1; cursor: pointer;">
                        <h3>${c.name}</h3>
                        <p>${c.clazz} (Stufe ${c.level}) • ${c.subclass || 'Keine Subklasse'}</p>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div class="switch-container">
                            <span class="switch-label">${isActiveInRoom ? 'Im Raum' : 'Inaktiv'}</span>
                            <label class="switch">
                                <input type="checkbox" ${isActiveInRoom ? 'checked' : ''} onchange="onSliderToggle('${c.id}', this)">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <span onclick="loadCharacter('${c.id}')" style="font-size: 0.75rem; color: var(--pos-color); font-weight: bold; cursor: pointer;">Auswählen ➔</span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function createNewCharacter() {
        let newId = 'char_' + Math.random().toString(36).substring(2, 9);
        let chars = getCharactersList();
        let defaultName = "Held von " + currentUser.toUpperCase();
        chars.push({ id: newId, name: defaultName, clazz: 'Barbar', subclass: 'Pfad des Weltenbaums', level: '6' });
        saveCharactersList(chars);

        currentActiveCharId = newId;
        localStorage.setItem('dnd_active_char_' + currentUser, newId);
        localStorage.setItem('dnd_room_active_char_' + currentUser + '_' + activeRoom, newId);

        localStorage.removeItem('dnd_sheet_data_' + currentUser + '_' + newId);
        loadCharacterData(newId);
        pushCharacterToCloud();
        switchMode('sheet');
    }

    function loadCharacter(charId) {
        currentActiveCharId = charId;
        localStorage.setItem('dnd_active_char_' + currentUser, charId);
        loadCharacterData(charId);
        switchMode('sheet');
    }

    function loadCharacterData(charId) {
        updateSubclasses();
        let saved = localStorage.getItem('dnd_sheet_data_' + currentUser + '_' + charId);
        if (!saved) return;

        let data = JSON.parse(saved);
        Object.keys(data).forEach(id => {
            let elem = document.getElementById(id);
            if (elem) {
                if (elem.type === 'checkbox') elem.checked = data[id];
                else elem.value = data[id];
            }
        });

        let btnToggle = document.getElementById('btn-toggle-rage');
        if (data.isRaging && btnToggle) btnToggle.classList.add('active');
        else if (btnToggle) btnToggle.classList.remove('active');

        if (data.conditions) {
            ['poisoned', 'stunned', 'prone', 'paralyzed'].forEach(cond => {
                let btn = document.getElementById('cond-' + cond);
                if (btn) btn.classList.toggle('active', !!data.conditions[cond]);
            });
        }

        updateRageButtonText();
        updateKiDisplay();
        updateActionSurgeDisplay();
        updateSecondWindDisplay();
        updateWildformDisplay();

        let spellsList = document.getElementById('spells-list');
        if (spellsList) {
            spellsList.innerHTML = '';
            if (data.spells && data.spells.length > 0) {
                data.spells.forEach(s => addSpell(s.prep, s.name, s.level, s.time, s.conc, s.notes));
            }
        }

        let weaponsList = document.getElementById('weapons-list');
        if (weaponsList) {
            weaponsList.innerHTML = '';
            if (data.weapons && data.weapons.length > 0) {
                data.weapons.forEach(w => addWeapon(w.name, w.magic, w.dice));
            } else {
                addWeapon('Waffe', 0, '1W8');
            }
        }

        let potionsContainer = document.getElementById('potions-container');
        if (potionsContainer) {
            potionsContainer.innerHTML = '';
            if (data.potions && data.potions.length > 0) {
                data.potions.forEach(p => addPotionSlot(p.type, p.count));
            } else {
                addPotionSlot('Heiltrank (1W4+4)', 1);
            }
        }

        onClassChange();
        updateAllCalculations();
    }

    function getMod(val) { return isNaN(val) ? 0 : Math.floor((val - 10) / 2); }

    function formatValue(elementId, val) {
        let elem = document.getElementById(elementId);
        if (!elem) return;
        elem.innerText = (val >= 0 ? "+" + val : val);
        if (val > 0) elem.style.color = "var(--pos-color)";
        else if (val < 0) elem.style.color = "var(--neg-color)";
        else elem.style.color = "var(--text-muted)";
    }

    function updateAllCalculations() {
        let pbEl = document.getElementById('pb');
        let pb = pbEl ? (parseInt(pbEl.value) || 0) : 0;
        formatValue('pb-display', pb);

        let strEl = document.getElementById('str');
        let dexEl = document.getElementById('dex');
        let conEl = document.getElementById('con');
        let intEl = document.getElementById('int');
        let wisEl = document.getElementById('wis');
        let chaEl = document.getElementById('cha');

        let strMod = getMod(strEl ? parseInt(strEl.value) : 10);
        let dexMod = getMod(dexEl ? parseInt(dexEl.value) : 10);
        let conMod = getMod(conEl ? parseInt(conEl.value) : 10);
        let intMod = getMod(intEl ? parseInt(intEl.value) : 10);
        let wisMod = getMod(wisEl ? parseInt(wisEl.value) : 10);
        let chaMod = getMod(chaEl ? parseInt(chaEl.value) : 10);

        formatValue('str-mod', strMod);
        formatValue('dex-mod', dexMod);
        formatValue('con-mod', conMod);
        formatValue('int-mod', intMod);
        formatValue('wis-mod', wisMod);
        formatValue('cha-mod', chaMod);

        let autoAcToggle = document.getElementById('auto-ac-toggle');
        if (autoAcToggle && autoAcToggle.checked) {
            let cls = document.getElementById('char-class').value;
            let calculatedAc = 10;
            if (cls === "Barbar") calculatedAc = 10 + dexMod + conMod;
            else if (cls === "Mönch") calculatedAc = 10 + dexMod + wisMod;
            let acField = document.getElementById('ac');
            if (acField) acField.value = calculatedAc;
        }

        let weaponRows = document.querySelectorAll('.weapon-row');
        weaponRows.forEach(row => {
            let magicElem = row.querySelector('.weapon-magic');
            let magicVal = magicElem ? (parseInt(magicElem.value) || 0) : 0;
            let totalAtk = strMod + pb + magicVal;
            let atkDisplay = row.querySelector('.weapon-atk-calc');
            if (atkDisplay) atkDisplay.innerText = (totalAtk >= 0 ? "+" + totalAtk : totalAtk);
        });

        let skillsMap = {
            'save-str': strMod, 'skill-athletik': strMod,
            'save-dex': dexMod, 'skill-akrobatik': dexMod, 'skill-fingerfertigkeit': dexMod, 'skill-heimlichkeit': dexMod,
            'save-con': conMod,
            'save-int': intMod, 'skill-arkanekunde': intMod, 'skill-geschichte': intMod,
            'save-wis': wisMod, 'skill-wahrnehmung': wisMod,
            'save-cha': chaMod, 'skill-einschuechtern': chaMod
        };

        Object.keys(skillsMap).forEach(id => {
            let checkbox = document.getElementById(id);
            let valElem = document.getElementById('val-' + id);
            if (checkbox && valElem) {
                let total = skillsMap[id] + (checkbox.checked ? pb : 0);
                valElem.innerText = (total >= 0 ? "+" + total : total);
                if (total > 0) valElem.style.color = "var(--pos-color)";
                else if (total < 0) valElem.style.color = "var(--neg-color)";
                else valElem.style.color = "var(--text-muted)";
            }
        });

        let spellAttrEl = document.getElementById('spell-attr');
        if (spellAttrEl) {
            let spellAttr = spellAttrEl.value;
            let spellMod = (spellAttr === 'int' ? intMod : (spellAttr === 'wis' ? wisMod : chaMod));
            let dcDisp = document.getElementById('spell-dc-display');
            if (dcDisp) dcDisp.innerText = 8 + pb + spellMod;
            let spellAtk = pb + spellMod;
            let atkDisp = document.getElementById('spell-atk-display');
            if (atkDisp) atkDisp.innerText = (spellAtk >= 0 ? "+" + spellAtk : spellAtk);
        }
        autoScaleResources();
    }

    function toggleSpellNotes(btn) {
        let wrapper = btn.closest('.spell-row-wrapper');
        let notesContainer = wrapper.querySelector('.spell-notes-container');
        notesContainer.classList.toggle('hidden');
        btn.innerText = notesContainer.classList.contains('hidden') ? '▼' : '▲';
    }

    function addSpell(prep = false, name = '', level = '0', time = '1 Akt.', conc = false, notes = '') {
        let list = document.getElementById('spells-list');
        if (!list) return;
        let wrapper = document.createElement('div');
        wrapper.className = 'spell-row-wrapper';
        wrapper.innerHTML = `
            <div class="spell-row">
                <input type="checkbox" class="spell-prep" ${prep ? 'checked' : ''} onchange="saveData()">
                <input type="text" placeholder="Zauber Name" value="${name}" class="field-left spell-name" oninput="saveData()">
                <select class="spell-level" onchange="saveData()">
                    <option value="0" ${level==='0'?'selected':''}>Trick</option>
                    <option value="1" ${level==='1'?'selected':''}>1. Grad</option>
                    <option value="2" ${level==='2'?'selected':''}>2. Grad</option>
                    <option value="3" ${level==='3'?'selected':''}>3. Grad</option>
                    <option value="4" ${level==='4'?'selected':''}>4. Grad</option>
                    <option value="5" ${level==='5'?'selected':''}>5. Grad</option>
                </select>
                <input type="text" placeholder="Zeit" value="${time}" class="spell-time" oninput="saveData()">
                <input type="checkbox" class="spell-conc" ${conc ? 'checked' : ''} onchange="saveData()">
                <button type="button" class="btn-rest" onclick="toggleSpellNotes(this)" title="Notizen" style="padding:4px; font-size:0.7rem;">▼</button>
                <button type="button" class="btn-remove" onclick="this.closest('.spell-row-wrapper').remove(); saveData();">✕</button>
            </div>
            <div class="spell-notes-container ${notes ? '' : 'hidden'}">
                <textarea placeholder="Zauber-Notizen & Effekte..." class="spell-notes" oninput="saveData()">${notes}</textarea>
            </div>
        `;
        list.appendChild(wrapper);
    }

    function addWeapon(name = '', magic = 0, dice = '1W12') {
        let list = document.getElementById('weapons-list');
        if (!list) return;
        let newRow = document.createElement('div');
        newRow.className = 'weapon-row';
        newRow.innerHTML = `
            <input type="text" placeholder="Waffe" value="${name}" class="field-left weapon-name" oninput="saveData()">
            <input type="number" placeholder="0" value="${magic}" class="weapon-magic" oninput="updateAllCalculations(); saveData();">
            <input type="text" placeholder="1W12" value="${dice}" class="weapon-dice" oninput="saveData()">
            <div class="calc-display weapon-atk-calc">+0</div>
            <button type="button" class="btn-remove" onclick="this.parentElement.remove(); saveData();">✕</button>
        `;
        list.appendChild(newRow);
        updateAllCalculations();
    }

    function addPotionSlot(selectedType = 'Heiltrank (1W4+4)', count = 1) {
        let list = document.getElementById('potions-container');
        if (!list) return;
        let row = document.createElement('div');
        row.className = 'char-select-card';
        row.style.marginBottom = '6px';
        row.style.padding = '8px';
        row.innerHTML = `
            <div style="flex-grow: 1; margin-right: 8px;">
                <select class="potion-type" onchange="saveData()">
                    <option value="Heiltrank (1W4+4)" ${selectedType==='Heiltrank (1W4+4)'?'selected':''}>🧪 Heiltrank (1W4+4)</option>
                    <option value="Großer Heiltrank (2W4+2)" ${selectedType==='Großer Heiltrank (2W4+2)'?'selected':''}>🧪 Großer Heiltrank (2W4+2)</option>
                    <option value="Überlegener Heiltrank (4W4+4)" ${selectedType==='Überlegener Heiltrank (4W4+4)'?'selected':''}>🧪 Überlegener Heiltrank (4W4+4)</option>
                    <option value="Höchster Heiltrank (8W4+8)" ${selectedType==='Höchster Heiltrank (8W4+8)'?'selected':''}>🧪 Höchster Heiltrank (8W4+8)</option>
                    <option value="Gegengift" ${selectedType==='Gegengift'?'selected':''}>🟢 Gegengift</option>
                    <option value="Manatrank / Arkane Essenz" ${selectedType==='Manatrank / Arkane Essenz'?'selected':''}>🔵 Manatrank / Arkane Essenz</option>
                    <option value="Custom Item" ${selectedType==='Custom Item'?'selected':''}>✨ Eigenes Item</option>
                </select>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <button type="button" class="btn-rest" onclick="adjustPotionRow(this, -1)">-</button>
                <input type="number" class="potion-count" value="${count}" oninput="saveData()" style="width: 45px; padding: 4px;">
                <button type="button" class="btn-rest" onclick="adjustPotionRow(this, 1)">+</button>
                <button type="button" class="btn-remove" onclick="this.closest('.char-select-card').remove(); saveData();" style="height:32px; width:32px;">✕</button>
            </div>
        `;
        list.appendChild(row);
    }

    function adjustPotionRow(btn, amount) {
        let input = btn.parentElement.querySelector('.potion-count');
        let val = (parseInt(input.value) || 0) + amount;
        input.value = Math.max(0, val);
        saveData();
    }

    function saveData() {
        if (!currentActiveCharId || !currentUser || currentRole === 'dm') return;
        
        let data = {};
        document.querySelectorAll('#view-sheet input, #view-sheet select, #view-sheet textarea').forEach(elem => {
            if (elem.id && !elem.closest('.spell-row-wrapper') && !elem.closest('.weapon-row') && !elem.closest('#potions-container')) {
                data[elem.id] = (elem.type === 'checkbox') ? elem.checked : elem.value;
            }
        });

        let btnToggle = document.getElementById('btn-toggle-rage');
        data.isRaging = (btnToggle && btnToggle.classList.contains('active'));
        let rCurr = document.getElementById('rage-curr');
        let rMax = document.getElementById('rage-max');
        let kiCurr = document.getElementById('ki-curr');
        let sCurr = document.getElementById('surge-curr');
        let wCurr = document.getElementById('wind-curr');
        let wWild = document.getElementById('wildform-curr');

        if (rCurr) data.rageCurr = rCurr.value;
        if (rMax) data.rageMax = rMax.value;
        if (kiCurr) data.kiCurr = kiCurr.value;
        if (sCurr) data.surgeCurr = sCurr.value;
        if (wCurr) data.windCurr = wCurr.value;
        if (wWild) data.wildformCurr = wWild.value;

        data.conditions = {
            poisoned: document.getElementById('cond-poisoned').classList.contains('active'),
            stunned: document.getElementById('cond-stunned').classList.contains('active'),
            prone: document.getElementById('cond-prone').classList.contains('active'),
            paralyzed: document.getElementById('cond-paralyzed').classList.contains('active')
        };

        let weapons = [];
        document.querySelectorAll('.weapon-row').forEach(row => {
            let wName = row.querySelector('.weapon-name');
            let wMag = row.querySelector('.weapon-magic');
            let wDice = row.querySelector('.weapon-dice');
            weapons.push({
                name: wName ? wName.value : '',
                magic: wMag ? wMag.value : '0',
                dice: wDice ? wDice.value : '1W8'
            });
        });
        data.weapons = weapons;

        let spells = [];
        document.querySelectorAll('.spell-row-wrapper').forEach(wrapper => {
            let sPrep = wrapper.querySelector('.spell-prep');
            let sName = wrapper.querySelector('.spell-name');
            let sLvl = wrapper.querySelector('.spell-level');
            let sTime = wrapper.querySelector('.spell-time');
            let sConc = wrapper.querySelector('.spell-conc');
            let sNotes = wrapper.querySelector('.spell-notes');
            spells.push({
                prep: sPrep ? sPrep.checked : false,
                name: sName ? sName.value : '',
                level: sLvl ? sLvl.value : '0',
                time: sTime ? sTime.value : '',
                conc: sConc ? sConc.checked : false,
                notes: sNotes ? sNotes.value : ''
            });
        });
        data.spells = spells;

        let potions = [];
        document.querySelectorAll('#potions-container .char-select-card').forEach(card => {
            let pType = card.querySelector('.potion-type');
            let pCount = card.querySelector('.potion-count');
            potions.push({
                type: pType ? pType.value : '',
                count: pCount ? pCount.value : '1'
            });
        });
        data.potions = potions;

        localStorage.setItem('dnd_sheet_data_' + currentUser + '_' + currentActiveCharId, JSON.stringify(data));

        let chars = getCharactersList();
        let cIndex = chars.findIndex(c => c.id === currentActiveCharId);
        let nameEl = document.getElementById('char-name');
        let classEl = document.getElementById('char-class');
        let subEl = document.getElementById('char-subclass');
        let lvlEl = document.getElementById('char-level');

        let cName = nameEl ? nameEl.value : 'Helden-Charakter';
        let cClass = classEl ? classEl.value : 'Abenteurer';
        let cSub = subEl ? subEl.value : '';
        let cLvl = lvlEl ? lvlEl.value : '1';

        if (cIndex >= 0) {
            chars[cIndex] = { id: currentActiveCharId, name: cName, clazz: cClass, subclass: cSub, level: cLvl };
        } else {
            chars.push({ id: currentActiveCharId, name: cName, clazz: cClass, subclass: cSub, level: cLvl });
        }
        saveCharactersList(chars);

        let activeInRoomCharId = localStorage.getItem('dnd_room_active_char_' + currentUser + '_' + activeRoom);
        if (activeInRoomCharId === currentActiveCharId) {
            pushCharacterToCloud();
        }
    }

    function initApp() {
        let savedRoom = localStorage.getItem('dnd_active_room_' + currentUser);
        if (savedRoom) {
            activeRoom = savedRoom;
            let joinInput = document.getElementById('join-room-input');
            let dmInput = document.getElementById('dm-room-code-input');
            if (joinInput) joinInput.value = activeRoom;
            if (dmInput) dmInput.value = activeRoom;
        }

        if (currentRole === 'player') {
            let chars = getCharactersList();
            if (chars.length === 0) {
                let presetId = loadDefaultPresetForUser(currentUser);
                if (!presetId) {
                    let defaultId = 'char_' + currentUser;
                    chars.push({ id: defaultId, name: 'Held von ' + currentUser.toUpperCase(), clazz: 'Barbar', subclass: 'Pfad des Weltenbaums', level: '6' });
                    saveCharactersList(chars);
                }
            }

            chars = getCharactersList();
            let lastChar = localStorage.getItem('dnd_active_char_' + currentUser) || (chars[0] ? chars[0].id : null);
            if (!lastChar && chars.length > 0) lastChar = chars[0].id;
            currentActiveCharId = lastChar;
            initCloudSync();
            switchMode('lobby');
        } else {
            initCloudSync();
            switchMode('dm');
        }
    }

    let savedUser = localStorage.getItem('dnd_logged_user');
    let savedRole = localStorage.getItem('dnd_logged_role');
    if (savedUser && validAccounts.includes(savedUser) && savedRole) {
        currentUser = savedUser;
        currentRole = savedRole;
        let loginOverlay = document.getElementById('login-overlay');
        if (loginOverlay) loginOverlay.classList.add('hidden');
        setupNavigation();
        let userDisp = document.getElementById('user-display-name');
        if (userDisp) userDisp.innerText = currentUser.toUpperCase() + (currentRole === 'dm' ? ' (DM)' : '');
        initApp();
    }
</script>
